# Rigenera il portfolio PDF quando cambiano i progetti (anche dal pannello) e lo carica nel pannello.
# Il PDF è privato: non sta nel repo né sul sito, si scarica solo dal pannello dopo l'accesso.
# Il pannello riconosce questa Action dal token OIDC di GitHub (nessun segreto condiviso).
name: Portfolio PDF
on:
  push:
    branches: [main]
    paths:
      - data/progetti.json
      - assets/img/**
      - assets/fonts/**
      - lavori/*/progetto.json
      - tools/genera-portfolio.js
      - tools/schema.js
      - favicon.svg
      - .github/workflows/portfolio.yml
  # dopo ogni pubblicazione del pannello, così il PDF c'è anche con un pannello nuovo
  workflow_run:
    workflows: [Pannello]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: portfolio-pdf
  cancel-in-progress: true
jobs:
  pdf:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright e Chromium
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Genera il PDF (si ferma se qualcosa si sovrappone)
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/genera-portfolio.js
      - name: Carica nel pannello
        env:
          PANNELLO: ${{ vars.PANNELLO_URL }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          source .github/actions/avvisa/pannello.sh
          [ -n "$PANNELLO_INDIRIZZO" ] && [ -n "$PANNELLO_TOKEN" ] || { echo "::error::non so dove caricare il PDF"; exit 1; }
          # se il pannello si sta ancora pubblicando, riprova
          for i in 1 2 3 4; do
            codice=$(curl -sS -o risposta.json -w '%{http_code}' -X PUT "$PANNELLO_INDIRIZZO/api/portfolio" \
              -H "authorization: Bearer $PANNELLO_TOKEN" -H 'x-pannello: 1' -H 'content-type: application/pdf' --data-binary @portfolio.pdf || echo 000)
            echo "pannello → $codice $(cat risposta.json 2>/dev/null)"
            [ "$codice" = 200 ] && { echo "### Portfolio caricato nel pannello ($(du -h portfolio.pdf | cut -f1))" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 30
          done
          exit 1
      - name: Avvisa sul telefono
        if: failure()
        uses: ./.github/actions/avvisa
        with:
          titolo: 'Portfolio PDF non aggiornato'
          testo: 'La generazione o il caricamento nel pannello si è fermato: apri i dettagli.'
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          pannello: ${{ vars.PANNELLO_URL }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
